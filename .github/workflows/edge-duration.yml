name: Public edge duration acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nginx-long-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - name: Record source and build the production edge test image
        run: |
          git rev-parse HEAD
          docker build -f deploy/Dockerfile.public --target test -t relay-public-edge-duration .
          docker image inspect --format '{{.Id}}' relay-public-edge-duration
      - name: Real Nginx and local CA, exact SSE for more than 35 minutes
        # No public ACME request, host port, private input or model charge.
        run: |
          docker run --rm -e RELAY_PUBLIC_LONG_STREAM_TEST=1 relay-public-edge-duration \
            -test.run='^TestPublicRealNginxLocalCAIntegration$' -test.v -test.count=1 -test.timeout=40m
