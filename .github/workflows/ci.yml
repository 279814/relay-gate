name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        # 不用 gofmt -l . 直接判：它对 vendor 与生成代码也报，
        # 而且没有非零退出码，漏格式化会静默通过。
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "以下文件未格式化："; echo "$out"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      # -race 只能在这里跑：竞态检测要 cgo，开发机（Windows，无 cgo）
      # 起不来。而这个项目的核心恰恰是并发 —— 在途计数、样本队列、
      # livecfg 的快照替换、SSE 流的三个超时看门狗，全是多协程共享状态。
      # 功能断言只能证明「这次对了」，证不了「没有数据竞争」。
      - name: go test -race
        run: go test -race -count=1 ./...

      # 第二轮不开 -race：竞态检测会把调度拉慢一个数量级，掩盖
      # 时序敏感的偶发失败（超时、TTFT、后台 writer 的进度）。
      # 这类 flaky 只有在正常速度下重复跑才现形。
      - name: go test（重复一轮查 flaky）
        run: go test -count=2 ./...

      - name: go build
        run: go build ./...

      # 前端的两个静态检查。ubuntu-latest 自带 node，不需要 setup-node ——
      # 原先「CI 里没有 node」的判断已经不成立了。
      #
      # 值得接进来的理由：这两项查的都是**静默**失败。绑定检查器查
      # 「x-model 写向一个不存在的属性」（勾了没反应，不报错也不空白），
      # 契约测试查 run() 的返回形状（漏改一处就让失败的操作看起来成功了）。
      # 只靠「有人记得手跑」的检查，等于没有检查 —— M6 的
      # logFilter.retriedOnly 就是在检查器存在的情况下漏进主干的。
      - name: 前端绑定检查
        run: node internal/web/bindings.check.js

      - name: 前端契约测试
        run: node internal/web/app.contract.test.js

      # M7 部署清单的静态检查（不需要 Docker，因此能进 CI）。
      # 它们守的是几条「一旦写错就有实际安全后果、但不会报错」的不变量。
      # 真正的容器行为由 scripts/smoke-m7.ps1 验（那个需要 Docker 引擎），
      # 这里守的是那些光读文件就能判定的部分。
      - name: 部署 entrypoint 静态检查
        run: sh scripts/check-entrypoint.sh

      - name: 部署清单静态检查
        run: sh scripts/check-deploy.sh

  # M7 的容器端到端。单独一个 job，因为它要 Docker 引擎而上面那些不要 ——
  # 合在一起的话，一次镜像构建会拖慢每一次纯 Go 的改动。
  #
  # 为什么必须在 CI 跑：开发机上禁止使用 Docker，而 M7 引入的每一样东西
  # （0600 库权限、PID 1 是谁、SIGTERM 直达、端口只绑 127.0.0.1、
  # 空 ACME 邮箱、空 IP 白名单）都**只在容器里**才成立或才会坏。
  # 本地 go test 全绿证明不了其中任何一条。
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # smoke-m7.ps1 是 PowerShell 的。ubuntu-latest 自带 pwsh，
      # 不需要额外安装步骤。
      - name: 容器端到端冒烟（M7）
        shell: pwsh
        run: pwsh -File scripts/smoke-m7.ps1
