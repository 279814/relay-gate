<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>relay-gate 管理</title>
<link rel="stylesheet" href="/admin/app.css">
</head>
<body>

<div x-data="app()" x-init="boot()" x-cloak>

  <!-- 登录页。未登录时只显示这个 —— 数据全在 API 后面，前端拿不到任何东西 -->
  <template x-if="!authed">
    <div class="login">
      <h1>relay-gate</h1>
      <p>输入管理口令（环境变量 <code>ADMIN_PASSWORD</code>）</p>
      <div class="alert err" x-show="err" x-text="err"></div>
      <form @submit.prevent="login()">
        <div class="field">
          <input type="password" x-model="pw" placeholder="管理口令" autofocus
                 autocomplete="current-password">
        </div>
        <button class="primary" type="submit" :disabled="busy" style="width:100%"
                x-text="busy ? '登录中…' : '登录'"></button>
      </form>
    </div>
  </template>

  <template x-if="authed">
    <div>
      <header>
        <h1>relay-gate</h1>
        <span class="tag dot" :class="stateTagClass()"
              x-text="stateLabel()"></span>
        <span class="grow"></span>
        <span class="note" x-show="warmupNote()" x-text="warmupNote()"></span>
        <span class="note" x-show="stateBlocked">状态待确认</span>
        <button @click="reloadState()" :disabled="busy || stateBusy">重新加载服务状态</button>
        <button @click="toggleState()" :disabled="busy || stateBusy || stateBlocked || stateRevision < 1 || displayState === 'maintenance'"
                x-text="running ? '暂停服务' : '启动服务'"></button>
        <button @click="logout()">登出</button>
      </header>

      <nav>
        <template x-for="t in tabs" :key="t.id">
          <button :class="{on: tab === t.id}" @click="go(t.id)" x-text="t.name"></button>
        </template>
      </nav>

      <main>
        <div class="alert err" x-show="err" x-text="err" @click="err = ''"></div>
        <div class="alert done" x-show="msg" x-text="msg" @click="msg = ''"></div>
        <div class="alert warn" x-show="auditWarning" x-text="auditWarning" @click="auditWarning = ''"></div>
        <div class="alert err" x-show="probeModuleError" x-text="probeModuleError"></div>
        <div class="alert warn" x-show="probeModuleReady === false && !probeModuleError">Probe 模块加载中…</div>

        <!-- ── 健康看板 ─────────────────────────────────────── -->
        <template x-if="tab === 'health'">
          <div>
            <div class="cards">
              <div class="card">
                <h3>本页可选路 / 本页总数</h3>
                <div class="v" x-text="`${health.summary?.selectable ?? 0} / ${health.summary?.total ?? 0}`"></div>
                <div class="sub">「可选路」复述的是选路此刻的真实判定</div>
              </div>
              <div class="card">
                <h3>在途请求</h3>
                <div class="v" x-text="inFlightTotal()"></div>
                <div class="sub">配了 max_concurrency 却选不中时先看这里</div>
              </div>
              <div class="card">
                <h3>样本落库 / 丢弃</h3>
                <div class="v" x-text="`${runtime.samples_written ?? 0} / ${runtime.samples_dropped ?? 0}`"></div>
                <div class="sub">丢弃是静默的：队列满时宁可丢样本也不阻塞转发</div>
              </div>
              <div class="card" style="cursor:pointer" @click="openRecentErrors && openRecentErrors()">
                <h3 x-text="(recentErrors.upstream_id || recentErrors.route_id || recentErrors.protocol || recentErrors.outcome || recentErrors.error_class || recentErrors.from_time || recentErrors.to_time)
                  ? '最近错误（筛选后）' : '最近错误'"></h3>
                <div class="v" x-text="recentErrors?.failed_count ?? 0"></div>
                <div class="sub" x-text="recentErrors?.latest?.error
                  ? ((recentErrors.latest.error.length > 80
                      ? recentErrors.latest.error.slice(0, 80) + '…'
                      : recentErrors.latest.error))
                  : '点击查看全部'"></div>
                <div class="sub" x-text="fmtTime(recentErrors?.latest?.ts_recv)"></div>
                <button type="button" @click.stop="openRecentErrors()">查看全部</button>
              </div>
            </div>

            <div class="mask" x-show="recentErrors?.open" @click.self="closeRecentErrors && closeRecentErrors()"
                 @keydown.escape.window="closeRecentErrors && closeRecentErrors()">
              <div class="modal wide" style="max-height:85vh;overflow:auto" @click.stop>
                <div class="bar">
                  <h3 style="margin:0">最近错误</h3>
                  <span class="grow"></span>
                  <button type="button" @click="closeRecentErrors && closeRecentErrors()">关闭</button>
                </div>
                <p class="dim">完整脱敏文本；按请求接收时间筛选失败的 Attempt。Capability 显示当前能力；Execution 打开该 Attempt 的精确记录。历史缺失或已清理的详情不可打开。</p>
                <div class="bar">
                  <label>Upstream ID
                    <input type="number" min="1" style="width:7rem" x-model="recentErrors.upstream_id" @change="applyRecentErrorFilters()">
                  </label>
                  <label>Route ID
                    <input type="number" min="1" style="width:7rem" x-model="recentErrors.route_id" @change="applyRecentErrorFilters()">
                  </label>
                  <label>协议
                    <select x-model="recentErrors.protocol" @change="applyRecentErrorFilters()">
                      <option value="">全部</option><option value="anthropic">Anthropic</option>
                      <option value="openai-responses">OpenAI Responses</option><option value="openai-chat">OpenAI Chat</option>
                    </select>
                  </label>
                  <label>失败类别（Outcome）
                    <select x-model="recentErrors.outcome" @change="applyRecentErrorFilters()">
                      <option value="">全部失败</option><option value="upstream_error">上游错误</option>
                      <option value="timeout">超时</option><option value="fake_alive">假活</option><option value="client_abort">客户端取消</option>
                    </select>
                  </label>
                  <label>错误类别（ErrorClass）
                    <select x-model="recentErrors.error_class" @change="applyRecentErrorFilters()">
                      <option value="">全部类别</option><option value="auth_rejected">认证拒绝</option>
                      <option value="request_shape_rejected">请求结构拒绝</option><option value="config_error">配置错误</option>
                      <option value="unsupported">不支持</option><option value="model_not_found">模型不存在</option>
                      <option value="rate_limited">限流</option><option value="unreachable">不可达</option>
                      <option value="transient_error">暂时错误</option><option value="fake_alive">假活</option>
                      <option value="partial_failure">部分失败</option><option value="ignored">未采用</option>
                      <option value="none">无上游错误</option><option value="unknown">历史未记录</option>
                    </select>
                  </label>
                  <label>接收时间从<input type="datetime-local" x-model="recentErrors.from_time" @change="applyRecentErrorFilters()"></label>
                  <label>至<input type="datetime-local" x-model="recentErrors.to_time" @change="applyRecentErrorFilters()"></label>
                  <button type="button" :disabled="recentErrors.loading" @click="refreshRecentErrors(true)">刷新</button>
                </div>
                <p class="alert err" x-show="err" x-text="err"></p>
                <div style="overflow:auto">
                <table>
                  <thead>
                    <tr><th>时间</th><th>上游 / Route</th><th>协议 / 端点</th><th>类别</th><th>模型</th><th>错误</th><th>关联</th></tr>
                  </thead>
                  <tbody>
                    <template x-for="row in (recentErrors?.logs || [])" :key="row.id">
                      <tr>
                        <td x-text="fmtTime(row.ts_recv)"></td>
                        <td><div x-text="row.upstream_name"></div><span x-text="row.route_id"></span></td>
                        <td><div x-text="row.protocol || '未记录'"></div><span x-text="row.endpoint"></span></td>
                        <td><div x-text="row.metadata?.error_class || 'unknown'"></div><span class="dim" x-text="row.outcome"></span></td>
                        <td x-text="row.model_in"></td>
                        <td><pre class="err-pre" style="overflow-wrap:anywhere;word-break:break-word" x-text="row.error || ''"></pre></td>
                        <td>
                          <button type="button" @click="copyRecentError(row.error)">复制</button>
                          <button type="button" :disabled="!row.route_id || !row.endpoint_kind" @click="openRecentErrorCapabilities(row)">当前 Capability</button>
                          <button type="button" :disabled="!row.metadata?.execution_id || !row.metadata?.execution_stored" @click="openRecentErrorExecutions(row)">精确 Execution</button>
                          <button type="button" :disabled="!row.req_id" @click="openRecentErrorRequestLogs(row)">RequestLog</button>
                          <button type="button" :disabled="!row.sample_id" @click="openRecentErrorSample(row)">Sample</button>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
                </div>
                <div class="bar">
                  <span class="dim" x-text="'已显示 ' + recentErrors.logs.length + ' / ' + recentErrors.failed_count"></span>
                  <button type="button" :disabled="recentErrors.loading || !recentErrors.next_cursor" @click="loadMoreRecentErrors()">加载更多</button>
                </div>
              </div>
            </div>

            <div class="bar">
              <label class="check">
                <input type="checkbox" x-model="autoRefresh"> 自动刷新（3s）
              </label>
              <select x-model="configPages.health.enabled" @change="pageConfig('health','reset')">
                <option value="">全部路由</option><option value="true">已启用路由</option><option value="false">已停用路由</option>
              </select>
              <input type="number" min="1" x-model="configPages.health.upstream_id" placeholder="上游 ID" style="width:7rem">
              <input type="number" min="1" x-model="configPages.health.model_name_id" placeholder="模型 ID" style="width:7rem">
              <button @click="pageConfig('health','reset')">筛选</button>
              <span class="grow"></span>
              <button :disabled="busy || !configPages.health.history.length" @click="pageConfig('health','prev')">上一页</button>
              <button :disabled="busy || !configPages.health.next" @click="pageConfig('health','next')">下一页</button>
              <button @click="loadHealth()">立即刷新</button>
            </div>
            <p class="dim">分页不影响实际选路；优先级数字越小越先尝试，本页按模型与优先级展示。</p>

            <table>
              <thead>
                <tr>
                  <th>模型</th><th>上游</th><th>优先级</th>
                  <th>Reachability</th><th>Capability</th><th>count_tokens</th><th>RouteHealth</th>
                  <th>可选路</th><th>TTFT</th><th>连续</th><th>最近错误</th><th></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="r in health.routes || []" :key="r.route_id">
                  <tr>
                    <td x-text="r.model_name || `#${r.model_name_id}`"></td>
                    <td>
                      <span x-text="r.upstream || `#${r.upstream_id}`"></span>
                      <span class="tag warn" x-show="lazyProbeWarning(r)"
                            x-text="'Lazy'" title="Lazy 不会周期请求"></span>
                    </td>
                    <td x-text="`${r.priority} / ${r.weight}`"></td>
                    <td>
                      <span class="tag" x-text="r.l1?.probed ? (r.l1?.ok ? 'reachable' : 'unreachable') : 'unknown'"></span>
                    </td>
                    <td>
                      <span class="tag" x-text="r.capability || '—'" :title="r.endpoint || '能力视图未装配'"></span>
                    </td>
                    <td>
                      <span class="tag" :class="countTokensClass(r.count_tokens)"
                            x-text="r.count_tokens || '—'"></span>
                    </td>
                    <td>
                      <span class="tag dot" :class="stateClass(r.state)" x-text="r.state"></span>
                    </td>
                    <td>
                      <template x-if="r.selectable">
                        <span class="tag ok">可用</span>
                      </template>
                      <template x-if="!r.selectable">
                        <span class="tag err" x-text="r.reason" :title="r.reason"></span>
                      </template>
                    </td>
                    <td class="num" x-text="r.health?.last_ttft_ms ? r.health.last_ttft_ms + 'ms' : '—'"></td>
                    <td class="num">
                      <span class="ok-text" x-text="r.health?.consecutive_ok ?? 0"></span> /
                      <span class="err-text" x-text="r.health?.consecutive_fail ?? 0"></span>
                    </td>
                    <td class="wrap dim" x-text="r.health?.last_error || '—'"></td>
                    <td class="nowrap">
                      <button @click="probe(r.route_id)" :disabled="probing === r.route_id"
                              :title="lazyProbeWarning(r) || '手动探活一次'"
                              x-text="probing === r.route_id ? '探测中…' : '测试'"></button>
                    </td>
                  </tr>
                </template>
                <tr x-show="!(health.routes || []).length">
                  <td colspan="12" class="empty">还没有 Route。先在「上游」与「模型」页建好，再到「路由」页绑定。</td>
                </tr>
              </tbody>
            </table>
            <p class="dim" x-show="probeResult?.execution_id"
               x-text="'本次手动探活 execution_id=' + (probeResult?.execution_id || '')"></p>

            <!-- One manual action displays its actual immutable execution. -->
            <template x-if="manualProbeResult()">
              <div class="panel">
                <div class="bar">
                  <strong x-text="`Route #${manualProbeResult().routeId} 探活结果`"></strong>
                  <span class="grow"></span>
                  <button @click="probeResult = null">关闭</button>
                </div>
                <table>
                  <thead><tr><th>端点</th><th>判定</th><th>状态码</th><th>首语义</th><th>总耗时</th><th>详情</th></tr></thead>
                  <tbody><tr>
                    <td x-text="manualProbeResult().endpoint"></td>
                    <td><span class="tag" :class="manualProbeResult().success ? 'ok' : manualProbeResult().errorClass === 'ignored' ? 'unknown' : 'err'"
                      x-text="manualProbeResult().success ? '成功' : manualProbeResult().errorClass || '未完成'"></span></td>
                    <td class="num" x-text="manualProbeResult().status || '—'"></td>
                    <td class="num" x-text="manualProbeResult().semanticMS"></td>
                    <td class="num" x-text="manualProbeResult().totalMS"></td>
                    <td class="wrap dim" x-text="manualProbeResult().detail || '—'"></td>
                  </tr></tbody>
                </table>
                <p class="dim" x-text="'能力：' + (manualProbeResult().capability || 'unknown') + ' · 站点可达：' + (manualProbeResult().reachable ? '是' : '未取得可达证据') + ' · 语义输出：' + (manualProbeResult().semanticSeen ? '有' : '无')"></p>
              </div>
            </template>
          </div>
        </template>

        <!-- ── 上游 ─────────────────────────────────────────── -->
        <template x-if="tab === 'upstreams'">
          <div>
            <div class="bar">
              <strong>上游站点</strong>
              <select x-model="configPages.upstreams.enabled" @change="pageConfig('upstreams','reset')">
        <option value="">全部状态</option>
        <option value="true">启用</option>
        <option value="false">停用</option>
        </select>
              <select x-model="configPages.upstreams.probe_mode" @change="pageConfig('upstreams','reset')">
        <option value="">全部探活模式</option>
        <option value="active">主动探活</option>
        <option value="lazy">懒探活</option>
        </select>
              <button :disabled="busy || !configPages.upstreams.history.length" @click="pageConfig('upstreams','prev')">上一页</button>
              <button :disabled="busy || !configPages.upstreams.next" @click="pageConfig('upstreams','next')">下一页</button>
        <button @click="pageConfig('upstreams','reset')">刷新</button>
              <span class="dim">全局配一次，通过「路由」绑到多个模型</span>
              <span class="grow"></span>
              <button class="primary" @click="editUp(null)">新增上游</button>
            </div>
            <table>
              <thead>
                <tr><th>名称</th><th>地址</th><th>Key</th>
                    <th title="各 Route 的 count_tokens Capability；Route 之间不一致时显示 mixed">count_tokens</th>
                    <th>状态</th><th></th></tr>
              </thead>
              <tbody>
                <template x-for="u in upstreams" :key="u.id">
                  <tr>
                    <td x-text="u.name"></td>
                    <td class="wrap mono" x-text="u.base_url"></td>
                    <td class="mono dim" x-text="u.api_key_is_set ? u.api_key : '未设置'"></td>
                    <td class="count-tokens-cell" :data-upstream-id="u.id">
                      <span class="tag" :class="countTokensClass(countTokensPosture(u.id).state)"
                            :data-ct-state="countTokensPosture(u.id).state"
                            :title="countTokensPosture(u.id).detail"
                            x-text="countTokensPosture(u.id).text"></span>
                      <template x-if="countTokensPosture(u.id).state === 'mixed'">
                        <div class="dim">
                          <template x-for="rc in countTokensPosture(u.id).routes" :key="rc.route_id">
                            <div x-text="`${rc.model}: ${rc.state}`"></div>
                          </template>
                        </div>
                      </template>
                    </td>
                    <td>
                      <span class="tag" :class="u.enabled ? 'ok' : 'unknown'"
                            x-text="u.enabled ? '启用' : '停用'"></span>
                    </td>
                    <td class="nowrap">
                      <button class="sm" @click="editUp(u)">编辑</button>
                      <button class="sm danger" @click="delUp(u)">删除</button>
                    </td>
                  </tr>
                </template>
                <tr x-show="!upstreams.length">
                  <td colspan="6" class="empty">还没有上游站点。</td>
                </tr>
              </tbody>
            </table>
          </div>
        </template>

        <!-- ── 模型 ─────────────────────────────────────────── -->
        <template x-if="tab === 'models'">
          <div>
            <div class="bar">
              <strong>逻辑模型</strong>
              <select x-model="configPages['model-names'].enabled" @change="pageConfig('model-names','reset')">
        <option value="">全部状态</option>
        <option value="true">启用</option>
        <option value="false">停用</option>
        </select>
              <select x-model="configPages['model-names'].protocol" @change="pageConfig('model-names','reset')">
        <option value="">全部协议</option>
        <option value="anthropic">Anthropic</option>
        <option value="openai-responses">Responses</option>
        <option value="openai-chat">Chat Completions</option>
        </select>
              <button :disabled="busy || !configPages['model-names'].history.length" @click="pageConfig('model-names','prev')">上一页</button>
              <button :disabled="busy || !configPages['model-names'].next" @click="pageConfig('model-names','next')">下一页</button>
        <button @click="pageConfig('model-names','reset')">刷新</button>
              <span class="dim">客户端请求里写的那个 model 值</span>
              <span class="grow"></span>
              <button class="primary" @click="editMn(null)">新增模型</button>
            </div>
            <table>
              <thead>
                <tr><th>名称</th><th>协议</th><th>匹配</th><th>兜底</th>
                    <th>探活 prompt</th><th>max_tokens</th><th>状态</th><th></th></tr>
              </thead>
              <tbody>
                <template x-for="m in modelNames" :key="m.id">
                  <tr>
                    <td class="mono" x-text="m.name"></td>
                    <td class="nowrap" x-text="m.protocol"></td>
                    <td x-text="m.match_mode"></td>
                    <td><span class="tag ok" x-show="m.is_fallback">兜底</span></td>
                    <td class="mono dim" x-text="m.probe_prompt"></td>
                    <td class="num" x-text="m.probe_max_tokens"></td>
                    <td>
                      <span class="tag" :class="m.enabled ? 'ok' : 'unknown'"
                            x-text="m.enabled ? '启用' : '停用'"></span>
                    </td>
                    <td class="nowrap">
                      <button class="sm" @click="editMn(m)">编辑</button>
                      <button class="sm danger" @click="delMn(m)">删除</button>
                    </td>
                  </tr>
                </template>
                <tr x-show="!modelNames.length">
                  <td colspan="8" class="empty">还没有逻辑模型。</td>
                </tr>
              </tbody>
            </table>
          </div>
        </template>

        <!-- ── 路由 ─────────────────────────────────────────── -->
        <template x-if="tab === 'routes'">
          <div>
            <div class="bar">
              <strong>路由</strong>
              <select x-model="configPages.routes.enabled" @change="pageConfig('routes','reset')">
        <option value="">全部状态</option>
        <option value="true">启用</option>
        <option value="false">停用</option>
        </select>
              <input type="number" min="1" x-model="configPages.routes.upstream_id" placeholder="上游 ID" style="width:7rem">
              <input type="number" min="1" x-model="configPages.routes.model_name_id" placeholder="模型 ID" style="width:7rem">
        <button @click="pageConfig('routes','reset')">筛选</button>
              <button :disabled="busy || !configPages.routes.history.length" @click="pageConfig('routes','prev')">上一页</button>
              <button :disabled="busy || !configPages.routes.next" @click="pageConfig('routes','next')">下一页</button>
              <span class="dim">模型 × 上游的绑定，探活与健康状态的最小单位</span>
              <span class="grow"></span>
              <button class="primary" @click="editRt(null)"
                      :disabled="!upstreams.length || !modelNames.length">新增路由</button>
            </div>
            <p class="dim" x-show="!upstreams.length || !modelNames.length">
              需要先有至少一个上游和一个模型。
            </p>
            <table>
              <thead>
                <tr><th>模型</th><th>上游</th><th>优先级</th><th>权重</th>
                    <th>上游模型名</th><th>并发上限</th><th>状态</th><th></th></tr>
              </thead>
              <tbody>
                <template x-for="r in routes" :key="r.id">
                  <tr>
                    <td x-text="mnName(r.model_name_id)"></td>
                    <td x-text="upName(r.upstream_id)"></td>
                    <td class="num" x-text="r.priority"></td>
                    <td class="num" x-text="r.weight"></td>
                    <!-- 空 = 不映射，body 一个字节都不改。这是推荐配置，要说清 -->
                    <td class="mono dim" x-text="r.upstream_model || '（不映射）'"></td>
                    <td class="num" x-text="r.max_concurrency || '不限'"></td>
                    <td>
                      <span class="tag" :class="r.enabled ? 'ok' : 'unknown'"
                            x-text="r.enabled ? '启用' : '停用'"></span>
                    </td>
                    <td class="nowrap">
                      <button class="sm" @click="editRt(r)">编辑</button>
                      <button class="sm danger" @click="delRt(r)">删除</button>
                    </td>
                  </tr>
                </template>
                <tr x-show="!routes.length">
                  <td colspan="8" class="empty">还没有路由绑定。</td>
                </tr>
              </tbody>
            </table>
          </div>
        </template>

        <!-- ── 样本 ─────────────────────────────────────────── -->
        <template x-if="tab === 'samples'">
          <div>
            <div class="bar">
              <strong>请求样本</strong>
              <span class="dim" x-text="`共 ${samplesTotal} 条（滚动窗口，置顶的不清）`"></span>
              <span class="grow"></span>
              <select x-model="sampleFilter.outcome" @change="loadSamples()">
                <option value="">全部结果</option>
                <option value="ok">ok</option>
                <option value="upstream_error">upstream_error</option>
                <option value="timeout">timeout</option>
                <option value="fake_alive">fake_alive</option>
                <option value="client_abort">client_abort</option>
              </select>
              <button @click="loadSamples()">刷新</button>
              <button class="danger" @click="clearSamples()">清空（保留置顶）</button>
            </div>

            <table>
              <thead>
                <tr><th>时间</th><th>端点</th><th>模型</th><th>上游</th>
                    <th>结果</th><th>状态</th><th>TTFT</th><th>总耗时</th><th></th></tr>
              </thead>
              <tbody>
                <template x-for="s in samples" :key="s.id">
                  <tr>
                    <td class="nowrap dim" x-text="fmtTime(s.ts_recv)"></td>
                    <td class="mono" x-text="s.endpoint"></td>
                    <td class="mono">
                      <span x-text="s.model_in"></span>
                      <!-- 映射发生时两个名字不同，值得显式标出来 -->
                      <span class="dim" x-show="s.model_out && s.model_out !== s.model_in"
                            x-text="' → ' + s.model_out"></span>
                    </td>
                    <td x-text="upName(s.upstream_id)"></td>
                    <td><span class="tag" :class="outcomeClass(s.outcome)" x-text="s.outcome"></span></td>
                    <td class="num" x-text="s.resp_status || '—'"></td>
                    <td class="num" x-text="ttft(s)"></td>
                    <td class="num" x-text="dur(s)"></td>
                    <td class="nowrap">
                      <button class="sm" @click="openSampleMetadata(s.id)">尝试元数据</button>
                      <button class="sm" @click="openSample(s.id)">正文（需认证）</button>
                      <button class="sm" @click="togglePin(s)"
                              x-text="s.pinned ? '取消置顶' : '置顶'"></button>
                    </td>
                  </tr>
                </template>
                <tr x-show="!samples.length">
                  <td colspan="9" class="empty">
                    还没有样本。样本在转发发生时才产生，且需要「设置」页的 sample_enabled 打开。
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </template>

        <!-- ── 请求日志（M6 诊断视图）──────────────────────── -->
        <template x-if="tab === 'reqlogs'">
          <div>
            <div class="bar">
              <strong>请求日志</strong>
              <span class="dim" x-text="`共 ${reqLogsTotal} 行（每次尝试一行）`"></span>
              <span class="grow"></span>
              <select x-model="logFilter.outcome" @change="loadReqLogs()">
                <option value="">全部结果</option>
                <option value="ok">ok</option>
                <option value="upstream_error">upstream_error</option>
                <option value="timeout">timeout</option>
                <option value="fake_alive">fake_alive</option>
                <option value="client_abort">client_abort</option>
              </select>
              <label class="check">
                <input type="checkbox" x-model="logFilter.only_retried" @change="loadReqLogs()">
                只看重试过的
              </label>
              <button @click="loadReqLogs()">刷新</button>
              <button class="danger" @click="clearReqLogs()">清空</button>
            </div>

            <!-- 重试统计：这是整张表存在的理由 —— 回答「重试到底有没有用」。
                 救回来的次数是唯一能证明它有价值的数字。 -->
            <div class="cards" x-show="retryStats">
              <div class="card">
                <h3>客户端请求</h3>
                <div class="v" x-text="retryStats?.requests ?? 0"></div>
                <div class="sub">近 24 小时</div>
              </div>
              <div class="card">
                <h3>重试过的</h3>
                <div class="v" x-text="retryStats?.retried ?? 0"></div>
                <div class="sub" x-text="retriedPct()"></div>
              </div>
              <div class="card">
                <h3>重试救回来的</h3>
                <div class="v" x-text="retryStats?.rescued_by_retry ?? 0"></div>
                <div class="sub">首次失败、换站后成功。这个数字是重试的全部价值</div>
              </div>
              <div class="card">
                <h3>重试后仍失败</h3>
                <div class="v" x-text="retryStats?.failed_after_retry ?? 0"></div>
                <div class="sub">换过站还是不行 —— 多半是所有站同时不可用</div>
              </div>
              <div class="card">
                <h3>尝试总数</h3>
                <div class="v" x-text="retryStats?.attempts ?? 0"></div>
                <div class="sub">比请求数多出的部分就是重试的额外开销</div>
              </div>
            </div>

            <!-- 丢弃计数必须显示：丢掉的日志会让上面的统计偏低（分母少了），
                 而一个不知道自己不准的数字比没有数字更糟。 -->
            <div class="empty" x-show="(runtime.request_logs_dropped ?? 0) > 0">
              有 <strong x-text="runtime.request_logs_dropped"></strong> 行日志因队列满被丢弃，
              上面的统计据此偏低。调大「设置」页的「日志队列容量」（改这个要重启）。
            </div>

            <table>
              <thead>
                <tr><th>时间</th><th>请求</th><th>尝试</th><th>上游</th><th>模型</th>
                    <th>结果</th><th>状态</th><th>TTFT</th><th></th></tr>
              </thead>
              <tbody>
                <template x-for="g in logGroups()" :key="g.req_id">
                  <template x-for="(l, i) in g.rows" :key="l.id">
                    <tr :class="i > 0 ? 'attempt-sub' : ''" x-show="i === 0 || expandedLogs[g.req_id]">
                      <td class="nowrap dim" x-text="i === 0 ? fmtTime(l.ts_recv) : ''"></td>
                      <td class="mono dim" x-text="i === 0 ? l.req_id.slice(0, 8) : ''"></td>
                      <!-- 第几次 / 共几次。一眼能看出这行是被丢弃的那次还是最终那次 -->
                      <td class="num nowrap">
                        <span x-text="`${l.attempt}/${l.attempts}`"></span>
                        <span class="tag err" x-show="l.retried" title="这次尝试被丢弃并换了站">换站</span>
                        <span class="tag unknown" x-show="l.half_open" title="全部站 dead 时的试探（§4.4c）">半开</span>
                      </td>
                      <td x-text="l.upstream_name || upName(l.upstream_id)"></td>
                      <td class="mono">
                        <span x-text="l.model_in"></span>
                        <span class="dim" x-show="l.model_out && l.model_out !== l.model_in"
                              x-text="' → ' + l.model_out"></span>
                      </td>
                      <td><span class="tag" :class="outcomeClass(l.outcome)" x-text="l.outcome"></span></td>
                      <td class="num" x-text="l.resp_status || '—'"></td>
                      <td class="num" x-text="l.ttft_ms ? l.ttft_ms + 'ms' : '—'"></td>
                      <td class="nowrap">
                        <button class="sm" @click="openAttemptMetadata(l)">Attempt 事实</button>
                        <button class="sm" x-show="i === 0 && g.rows.length > 1"
                                @click="toggleLog(g.req_id)"
                                x-text="expandedLogs[g.req_id] ? '收起' : `展开 ${g.rows.length} 次`"></button>
                        <button class="sm" x-show="i === 0" @click="openLogSample(g.req_id)">样本</button>
                      </td>
                    </tr>
                  </template>
                </template>
                <tr x-show="!reqLogs.length">
                  <td colspan="9" class="empty">
                    还没有日志。日志在转发发生时才产生，且需要「设置」页的
                    「记录请求日志」打开。它与样本是<b>两份独立的</b>记录：
                    样本存字节，日志存「这次请求经历了什么」。
                  </td>
                </tr>
              </tbody>
            </table>

            <!-- 失败原因单独列出来。表格里那一列放不下完整的错误文本，
                 而错误原文恰恰是排查时最有用的东西（后端刻意写给人看的）。 -->
            <div x-show="failedLogs().length" style="margin-top:14px">
              <h3 style="font-size:13px;margin:0 0 8px">失败详情</h3>
              <table>
                <thead>
                  <tr><th>请求</th><th>上游</th><th>原因</th></tr>
                </thead>
                <tbody>
                  <template x-for="l in failedLogs()" :key="l.id">
                    <tr>
                      <td class="mono dim nowrap"
                          x-text="l.req_id.slice(0, 8) + ' #' + l.attempt"></td>
                      <td class="nowrap" x-text="l.upstream_name || upName(l.upstream_id)"></td>
                      <td class="mono" x-text="l.error"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </template>

        <!-- ── 探活成本 ─────────────────────────────────────── -->
        <template x-if="tab === 'cost'">
          <div>
            <div class="bar">
              <strong>探活开销</strong>
              <span class="dim" x-text="cost.cost?.day ? `统计日期 ${cost.cost.day}（本地时区，跨天归零）` : ''"></span>
              <span class="grow"></span>
              <button @click="loadCost()">刷新</button>
            </div>

            <div class="cards">
              <div class="card">
                <h3>L1 次数（零 token）</h3>
                <div class="v" x-text="cost.cost?.l1_count ?? 0"></div>
                <div class="sub" x-text="`失败 ${cost.cost?.l1_failed ?? 0} 次`"></div>
              </div>
              <div class="card">
                <h3>L2 次数（真实调用）</h3>
                <div class="v" x-text="cost.cost?.l2_count ?? 0"></div>
                <div class="sub" x-text="`失败 ${cost.cost?.l2_failed ?? 0} 次`"></div>
              </div>
              <div class="card">
                <h3>估算 token</h3>
                <div class="v" x-text="cost.cost?.est_tokens ?? 0"></div>
                <!-- 必须标明是估算：它不是账单，用途是判断策略是否过激 -->
                <div class="sub">估算上界，非账单</div>
              </div>
              <div class="card">
                <h3>探活策略</h3>
                <div class="v">按站 Active/Lazy</div>
                <div class="sub" x-text="cost.piggyback_enabled ? 'piggyback 开（真实流量抵扣 L2）' : 'piggyback 关'"></div>
              </div>
            </div>

            <!-- 次数要和间隔一起看，否则「今天探了 4300 次」判断不了是否过激 -->
            <p class="dim" x-show="cost.intervals">
              当前间隔：L1 alive <span x-text="cost.intervals?.l1_alive_sec"></span>s /
              dead <span x-text="cost.intervals?.l1_dead_sec"></span>s；
              L2 alive <span x-text="cost.intervals?.l2_alive_sec"></span>s /
              dead <span x-text="cost.intervals?.l2_dead_sec"></span>s。
              dead 站的间隔刻意短得多 —— 尽快发现恢复是本项目的核心诉求。
            </p>

            <h3 style="font-size:13px;margin:18px 0 8px">各 Route 的 L2 开销</h3>
            <table>
              <thead>
                <tr><th>模型 × 上游</th><th>L2 次数</th><th>失败</th>
                    <th>估算 token</th><th>最近一次</th></tr>
              </thead>
              <tbody>
                <template x-for="rc in cost.cost?.routes || []" :key="rc.route_id">
                  <tr>
                    <td x-text="routeLabel(rc.route_id)"></td>
                    <td class="num" x-text="rc.l2_count"></td>
                    <td class="num" :class="rc.l2_failed ? 'err-text' : ''" x-text="rc.l2_failed"></td>
                    <td class="num" x-text="rc.est_tokens"></td>
                    <td class="nowrap dim" x-text="fmtTime(rc.last_l2_at)"></td>
                  </tr>
                </template>
                <tr x-show="!(cost.cost?.routes || []).length">
                  <td colspan="5" class="empty">今天还没有 L2 探活。</td>
                </tr>
              </tbody>
            </table>

            <h3 style="font-size:13px;margin:18px 0 8px">各上游的 L1 次数</h3>
            <p class="dim" style="margin:0 0 8px">
              L1 记在站上而不是 Route 上：一次 L1 被同站多个 Route 共享，
              记到 Route 会把一次请求算成 N 次。
            </p>
            <table>
              <thead><tr><th>上游</th><th>L1 次数</th><th>失败</th><th>最近一次</th></tr></thead>
              <tbody>
                <template x-for="uc in cost.cost?.upstreams || []" :key="uc.upstream_id">
                  <tr>
                    <td x-text="upName(uc.upstream_id)"></td>
                    <td class="num" x-text="uc.l1_count"></td>
                    <td class="num" :class="uc.l1_failed ? 'err-text' : ''" x-text="uc.l1_failed"></td>
                    <td class="nowrap dim" x-text="fmtTime(uc.last_l1_at)"></td>
                  </tr>
                </template>
                <tr x-show="!(cost.cost?.upstreams || []).length">
                  <td colspan="4" class="empty">今天还没有 L1 探活。</td>
                </tr>
              </tbody>
            </table>
          </div>
        </template>

        <!-- ── 设置 ─────────────────────────────────────────── -->
        <!-- ── 凭据（P2）──────────────────────────────────── -->
        <template x-if="tab === 'credentials'">
          <div>
            <div class="bar">
              <strong>凭据与 Master Key</strong>
              <span class="dim">查看/轮换需再次输入管理员密码；Cache-Control: no-store</span>
              <span class="grow"></span>
              <span class="tag warn" x-show="displayState === 'maintenance'" x-text="'维护中：' + (maintenanceReason || 'credential')"></span>
              <button @click="loadCredentials(); loadAuditEvents(true)">刷新</button>
            </div>
            <div class="row" style="margin-bottom:12px">
              <div class="field" style="max-width:280px">
                <label>管理员密码（操作前填写）</label>
                <input type="password" x-model="credentials.password" autocomplete="current-password">
              </div>
            </div>
            <div class="cards">
              <div class="card">
                <h3>Relay Key</h3>
                <div class="sub" x-text="'active fp: ' + (credentials.status?.relay_active_fingerprint || '—')"></div>
                <div class="sub" x-text="'grace fp: ' + (credentials.status?.relay_grace_fingerprint || '—')
                  + ' · left ' + (credentials.status?.relay_grace_seconds_left ?? 0) + 's'"></div>
                <div class="bar" style="margin-top:8px">
                  <button class="primary" @click="rotateRelayKey()" :disabled="displayState === 'maintenance'">轮换</button>
                  <button @click="revokeRelayGrace()" :disabled="displayState === 'maintenance'">立即撤销旧 Key</button>
                </div>
                <div class="mono wrap" x-show="credentials.relay_key" x-text="credentials.relay_key"></div>
              </div>
              <div class="card">
                <h3>Master Key</h3>
                <div class="sub" x-text="'key_id: ' + (credentials.status?.keyring?.key_id || '—')"></div>
                <div class="sub" x-text="'phase: ' + (credentials.status?.keyring?.phase || 'idle')"></div>
                <div class="bar" style="margin-top:8px">
                  <button @click="revealMasterKey()">短时查看</button>
                </div>
                <div class="mono wrap" x-show="credentials.master_key" x-text="credentials.master_key"></div>
                <div class="field" style="margin-top:10px">
                  <label>新 Master Key（≥16）</label>
                  <input type="password" x-model="credentials.new_master" autocomplete="new-password">
                </div>
                <div class="sub" x-show="credentials.status?.blocked_reason" x-text="credentials.status?.blocked_reason"></div>
                <button class="primary" @click="rotateMasterKey()" :disabled="!canRotateMasterKey()">轮换 Master Key</button>
              </div>
              <div class="card">
                <h3>管理员密码</h3>
                <div class="sub">不可查看，可重新生成；重置后其他会话立即失效</div>
                <button @click="resetAdminPassword()">重置并显示一次</button>
                <div class="mono wrap" x-show="credentials.admin_password" x-text="credentials.admin_password"></div>
              </div>
            </div>
            <h3 style="font-size:13px;margin:18px 0 8px">持久审计历史</h3>
            <p class="sub" x-text="'本次运行审计写入失败：' + (credentials.status?.audit_missed_count || 0)"></p>
            <p class="dim">等待确认或结果待核实表示没有完成记录；请先核实当前配置和轮换阶段，勿直接重复操作。</p>
            <div class="bar" style="flex-wrap:wrap;align-items:end">
              <label class="field">类别
                <select x-model="credentials.audit.filter.category">
                  <option value="">全部</option><option value="credential">凭据</option><option value="sample">样本</option>
                  <option value="probe">配方与探活</option><option value="route">路由</option><option value="transform">转换</option>
                  <option value="security">安全</option><option value="configuration">配置</option><option value="session">会话</option><option value="backup">备份</option>
                </select>
              </label>
              <label class="field">结果
                <select x-model="credentials.audit.filter.outcome">
                  <option value="">全部</option><option value="succeeded">已完成</option><option value="failed">未完成</option>
                  <option value="pending">等待确认</option><option value="unknown">结果待核实</option>
                </select>
              </label>
              <label class="field">动作<input x-model="credentials.audit.filter.action" maxlength="64" placeholder="如 route_disable"></label>
              <label class="field">资源类型<input x-model="credentials.audit.filter.resource_type" maxlength="40" placeholder="如 route、recipe"></label>
              <label class="field">资源 ID<input x-model="credentials.audit.filter.resource_id" maxlength="128"></label>
              <label class="field">开始时间<input type="datetime-local" x-model="credentials.audit.filter.after"></label>
              <label class="field">结束时间<input type="datetime-local" x-model="credentials.audit.filter.before"></label>
              <button @click="loadAuditEvents(true)" :disabled="credentials.audit.loading">筛选 / 刷新</button>
            </div>
            <div class="alert err" x-show="credentials.audit.error" x-text="credentials.audit.error"></div>
            <table>
              <thead><tr><th>时间</th><th>类别 / 动作</th><th>资源</th><th>结果</th><th>原因码</th></tr></thead>
              <tbody>
                <template x-for="ev in credentials.audit.items" :key="ev.id">
                  <tr>
                    <td class="mono" x-text="new Date(ev.at_ms).toLocaleString()"></td>
                    <td class="wrap" x-text="ev.category + ' / ' + ev.action"></td>
                    <td class="mono wrap" x-text="ev.resource_type + (ev.resource_id ? ' #' + ev.resource_id : '')"></td>
                    <td x-text="auditOutcomeLabel(ev.outcome)"></td>
                    <td class="wrap" x-text="ev.reason_code || '—'"></td>
                  </tr>
                </template>
                <tr x-show="!credentials.audit.items.length"><td colspan="5" class="empty" x-text="credentials.audit.loading ? '加载中…' : '暂无匹配审计'"></td></tr>
              </tbody>
            </table>
            <div class="bar" style="margin-top:10px">
              <span class="dim" x-text="'已载入 ' + credentials.audit.items.length + ' 条'"></span>
              <span class="grow"></span>
              <button @click="loadAuditEvents(false)" :disabled="credentials.audit.loading || !credentials.audit.nextCursor">下一页</button>
            </div>
          </div>
        </template>

        <!-- ── 安全中心（P3）──────────────────────────────── -->
        <template x-if="tab === 'security'">
          <div>
            <div class="bar">
              <strong>Security Center</strong>
              <span class="dim">被动扫描 · 手动 canary · SMTP（纯文本）</span>
              <span class="grow"></span>
              <button @click="loadSecurityFindings()">刷新 findings</button>
            </div>
            <div class="row" style="margin-bottom:12px">
              <div class="field" style="max-width:160px">
                <label>严重级别</label>
                <select x-model="security.severity" @change="loadSecurityFindings()">
                  <option value="">全部</option>
                  <option value="critical">critical</option>
                  <option value="high">high</option>
                  <option value="medium">medium</option>
                  <option value="low">low</option>
                  <option value="info">info</option>
                </select>
              </div>
              <div class="field" style="flex:1">
                <label>诊断扫描文本</label>
                <input x-model="security.scanText" placeholder="粘贴响应片段（仅本地规则）">
              </div>
              <button class="primary" @click="runSecurityScan()">扫描</button>
            </div>
            <div class="row" style="margin-bottom:12px">
              <div class="field" style="max-width:200px">
                <label>手动 Canary Route ID（需 Active）</label>
                <input x-model="security.canaryRouteId" placeholder="route id">
              </div>
              <button @click="runSecurityCanary()">运行 Canary</button>
            </div>
            <table>
              <thead><tr><th>时间</th><th>级别</th><th>类别</th><th>摘要</th><th>来源</th></tr></thead>
              <tbody>
                <template x-for="f in (security.findings || [])" :key="f.id">
                  <tr>
                    <td class="mono" x-text="f.at_ms"></td>
                    <td x-text="f.severity"></td>
                    <td x-text="f.category"></td>
                    <td class="wrap" x-text="f.summary"></td>
                    <td x-text="f.source"></td>
                  </tr>
                </template>
                <tr x-show="!(security.findings || []).length"><td colspan="5" class="empty">暂无 finding</td></tr>
              </tbody>
            </table>
            <h3 style="font-size:13px;margin:18px 0 8px">SMTP 告警</h3>
            <template x-if="security.smtp">
            <div class="cards">
              <fieldset class="card" style="min-width:0" :disabled="security.smtpSaving || security.smtpLoading">

                </div>
                <div class="field"><label>From</label><input x-model="security.smtp.from"></div>

                <div class="field"><label>Username</label><input x-model="security.smtp.username"></div>
                <div class="field"><label>Password（留空保持）</label><input type="password" x-model="security.smtpPassword"></div>
                <div class="field"><label>最低级别</label>
                  <select x-model="security.smtp.min_severity">

                </div>
                <div class="field"><label>聚合窗口（秒）</label><input type="number" min="1" max="86400" step="1" x-model.number="security.smtp.aggregation_window_sec"></div>
                <div class="field"><label>相同告警限流窗口（秒）</label><input type="number" min="1" max="86400" step="1" x-model.number="security.smtp.rate_limit_window_sec"></div>

                  <button @click="loadSMTP(true)">重新加载配置</button>
                  <button @click="testSMTP()">测试已保存配置</button>
                </div>
              </fieldset>
            </div>
            </template>
          </div>
        </template>

        <!-- ── 声明式转换（P4）─────────────────────────────── -->

                  </tbody>

              <div style="flex:1" x-show="transforms.selected">
                <div class="field">
                  <label>草稿规则（JSON 数组）</label>
                  <textarea rows="10" class="mono" x-model="transforms.draftRulesJSON" style="width:100%"></textarea>
                </div>
                <div class="field">
                  <label><input type="checkbox" x-model="transforms.requestReencode"> 允许压缩请求改写（gzip/br）</label>
                  <small>仅发布后生效。此绑定退出严格字节透传：重编码会改变原始压缩字节，正文上限 8 MiB。</small>
                </div>
                <div class="row">
                  <div class="field">
                    <label>请求失败策略</label>
                    <select x-model="transforms.reqFailPolicy">
                      <option value="fail_closed">fail_closed</option>
                      <option value="fail_open">fail_open</option>
                    </select>
                  </div>
                  <div class="field">
                    <label>响应失败策略</label>
                    <select x-model="transforms.resFailPolicy">
                      <option value="fail_open">fail_open</option>
                      <option value="fail_closed">fail_closed</option>
                    </select>
                  </div>
                  <div class="field" style="flex:1">
                    <label>备注</label>
                    <input x-model="transforms.note">
                  </div>
                </div>
                <div class="bar" style="margin:8px 0">
                  <button class="primary" @click="saveTransformDraft()">保存草稿</button>
                </div>
                <div class="row">
                  <div class="field" style="max-width:120px">
                    <label>Route ID</label>
                    <input x-model="transforms.routeId">
                  </div>
                  <div class="field" style="max-width:120px">
                    <label>Endpoint ID</label>
                    <input x-model="transforms.endpointId">
                  </div>
                  <button @click="publishTransform()">Publish</button>
                  <button @click="shadowTransform()">Shadow</button>
                </div>
                <div class="field" style="margin-top:12px">
                  <label>Preview phase / body</label>

                    <select x-model="transforms.previewPhase">
                      <option value="request">request</option>
                      <option value="response">response</option>
                    </select>
                    <input style="flex:1" x-model="transforms.previewBody" placeholder='{"model":"x"}'>
                    <button @click="previewTransform()">Preview</button>
                  </div>
                  <pre class="mono wrap" style="margin-top:8px;white-space:pre-wrap" x-text="transforms.previewResult"></pre>
                </div>
              </div>
            </div>
            <h3 style="font-size:13px;margin:18px 0 8px">Bindings</h3>
            <table>
              <thead><tr><th>Route</th><th>Endpoint</th><th>Set</th><th>Published</th><th>Shadow</th></tr></thead>
              <tbody>
                <template x-for="(b, idx) in (transforms.bindings || [])" :key="idx">
                  <tr>
                    <td class="mono" x-text="b.route_id"></td>
                    <td class="mono" x-text="b.endpoint_id"></td>
                    <td class="mono" x-text="b.set_id"></td>
                    <td class="mono" x-text="b.published_id || '—'"></td>
                    <td class="mono" x-text="b.shadow_id || '—'"></td>
                  </tr>
                </template>
                <tr x-show="!(transforms.bindings || []).length"><td colspan="5" class="empty">暂无绑定</td></tr>
              </tbody>
            </table>
            <h3 style="font-size:13px;margin:18px 0 8px">Executions（脱敏）</h3>
            <table>
              <thead><tr><th>时间</th><th>Phase</th><th>OK</th><th>Hits</th><th>Error</th></tr></thead>
              <tbody>
                <template x-for="(ex, idx) in (transforms.executions || [])" :key="idx">
                  <tr>
                    <td class="mono" x-text="ex.at"></td>
                    <td x-text="ex.phase"></td>
                    <td x-text="ex.ok ? 'yes' : 'no'"></td>
                    <td class="wrap" x-text="(ex.hit_rules || []).join(', ')"></td>
                    <td class="wrap" x-text="ex.error || ''"></td>
                  </tr>
                </template>
                <tr x-show="!(transforms.executions || []).length"><td colspan="5" class="empty">暂无执行记录</td></tr>
              </tbody>
            </table>
            <h3 style="font-size:13px;margin:18px 0 8px">本次运行预算调整</h3>
            <p class="dim">这里保留本次运行的调整细节；完整持久审计历史见凭据页。</p>
            <table>
              <thead><tr><th>时间</th><th>动作</th><th>详情</th><th>确认提高</th></tr></thead>
              <tbody>
                <template x-for="(a, idx) in (transforms.budgetAudit || [])" :key="idx">
                  <tr>
                    <td class="mono" x-text="a.at"></td>
                    <td x-text="a.action"></td>
                    <td class="wrap" x-text="a.detail"></td>
                    <td x-text="a.confirmed_raise ? 'yes' : 'no'"></td>
                  </tr>
                </template>
                <tr x-show="!(transforms.budgetAudit || []).length"><td colspan="4" class="empty">暂无</td></tr>
              </tbody>
            </table>
          </div>
        </template>

        <template x-if="tab === 'settings'">
          <div>
            <div class="bar">
              <strong>全局设置</strong>
              <span class="dim">热生效，无需重启（队列容量类的除外，已注明）</span>
              <span class="grow"></span>
              <span class="dim" x-text="settingsModuleReady ? '版本 ' + settingsState.revision : '设置模块未就绪'"></span>
              <button @click="reloadSettings()" :disabled="!settingsModuleReady || busy || settingsState.busy || settingsState.loading">重新加载</button>
              <button id="settings-save" class="primary" @click="saveSettings()" :disabled="!settingsModuleReady || busy || settingsState.busy || settingsState.loading || settingsState.conflict || settingsState.pending || !settings">保存</button>
            </div>

            <p class="note" x-show="settingsModuleReady && settingsState.conflict">草稿版本已落后；重新加载会替换当前草稿，请先复制需要保留的修改。</p>
            <p class="note" x-show="settingsModuleReady && settingsState.pending">设置已保存，激活待确认；请重新加载保存的版本，确认后再操作。</p>
            <template x-if="settings && settingsModuleReady">
              <div>
                <h3 style="font-size:13px;margin:14px 0 8px">真实请求超时</h3>
                <p class="note" x-text="`首语义硬下限 ${limits.min_real_first_semantic_sec || 300}s；各阶段从请求发送时起算，总时长始终是上限。`"></p>
                <div class="row">
                  <div class="field">
                    <label>连接 (s)</label>
                    <input type="number" min="1" data-settings-stage="real_connect_sec" x-model.number="settings.real_connect_sec" :disabled="settingsState.busy || settingsState.loading">
                  </div>
                  <div class="field">
                    <label>响应头 (s)</label>
                    <input type="number" min="1" data-settings-stage="real_response_header_sec" x-model.number="settings.real_response_header_sec" :disabled="settingsState.busy || settingsState.loading">
                  </div>
                  <div class="field">
                    <label>首字节 (s)</label>
                    <input type="number" min="1" data-settings-stage="real_first_byte_sec" x-model.number="settings.real_first_byte_sec" :disabled="settingsState.busy || settingsState.loading">
                  </div>
                  <div class="field">
                    <label>首语义 (s)</label>
                    <input type="number" min="1" data-settings-stage="real_first_semantic_sec" x-model.number="settings.real_first_semantic_sec" :disabled="settingsState.busy || settingsState.loading">
                  </div>
                  <div class="field">
                    <label>流内静默 (s)</label>
                    <input type="number" min="1" data-settings-stage="real_idle_sec" x-model.number="settings.real_idle_sec" :disabled="settingsState.busy || settingsState.loading">
                  </div>
                  <div class="field">
                    <label>总时长 (s)</label>
                    <input type="number" min="1" data-settings-stage="real_total_sec" x-model.number="settings.real_total_sec" :disabled="settingsState.busy || settingsState.loading">
                  </div>
                </div>
                <h3 style="font-size:13px;margin:18px 0 8px">模型探活超时</h3>
                <p class="note">独立于真实请求。标准最小配方可使用较短观察窗；原生长思考配方首语义至少等待 300 秒。</p>
                <div class="row">
                  <div class="field">
                    <label>L2 连接 (s)</label>
                    <input type="number" min="1" data-settings-stage="l2_connect_sec" x-model.number="settings.l2_connect_sec" :disabled="settingsState.busy || settingsState.loading">
                  </div>
                  <div class="field">
                    <label>L2 响应头 (s)</label>
                    <input type="number" min="1" data-settings-stage="l2_response_header_sec" x-model.number="settings.l2_response_header_sec" :disabled="settingsState.busy || settingsState.loading">
                  </div>
                  <div class="field">
                    <label>L2 首字节 (s)</label>
                    <input type="number" min="1" data-settings-stage="l2_first_byte_sec" x-model.number="settings.l2_first_byte_sec" :disabled="settingsState.busy || settingsState.loading">
                  </div>
                  <div class="field">
                    <label>L2 首事件 (s)</label>
                    <input type="number" min="1" data-settings-stage="l2_first_event_sec" x-model.number="settings.l2_first_event_sec" :disabled="settingsState.busy || settingsState.loading">
                  </div>
                  <div class="field">
                    <label>L2 首语义 (s)</label>
                    <input type="number" min="1" data-settings-stage="l2_first_semantic_sec" x-model.number="settings.l2_first_semantic_sec" :disabled="settingsState.busy || settingsState.loading">
                  </div>
                  <div class="field">
                    <label>L2 流内静默 (s)</label>
                    <input type="number" min="1" data-settings-stage="l2_idle_sec" x-model.number="settings.l2_idle_sec" :disabled="settingsState.busy || settingsState.loading">
                  </div>
                  <div class="field">
                    <label>L2 总时长 (s)</label>
                    <input type="number" min="1" data-settings-stage="l2_total_sec" x-model.number="settings.l2_total_sec" :disabled="settingsState.busy || settingsState.loading">
                  </div>
                </div>
                <h3 style="font-size:13px;margin:18px 0 8px">轻量端点超时</h3>
                <div class="row">
                  <div class="field">
                    <label>L1 连接 (s)</label>
                    <input type="number" min="1" data-settings-stage="l1_connect_sec" x-model.number="settings.l1_connect_sec" :disabled="settingsState.busy || settingsState.loading">
                  </div>
                  <div class="field">
                    <label>L1 总时长 (s)</label>
                    <input type="number" min="1" data-settings-stage="l1_total_sec" x-model.number="settings.l1_total_sec" :disabled="settingsState.busy || settingsState.loading">
                  </div>
                  <div class="field">
                    <label>count_tokens 连接 (s)</label>
                    <input type="number" min="1" data-settings-stage="count_tokens_connect_sec" x-model.number="settings.count_tokens_connect_sec" :disabled="settingsState.busy || settingsState.loading">
                  </div>
                  <div class="field">
                    <label>count_tokens 总时长 (s)</label>
                    <input type="number" min="1" data-settings-stage="count_tokens_total_sec" x-model.number="settings.count_tokens_total_sec" :disabled="settingsState.busy || settingsState.loading">
                  </div>
                </div>

                <h3 style="font-size:13px;margin:18px 0 8px">探活调度</h3>
                <div class="row">
                  <div class="field">
                    <label>L1 间隔 · alive (s)</label>
                    <input type="number" x-model.number="settings.l1_interval_alive_sec">
                  </div>
                  <div class="field">
                    <label>L1 间隔 · dead (s)</label>
                    <input type="number" x-model.number="settings.l1_interval_dead_sec">
                  </div>
                  <div class="field">
                    <label>L2 间隔 · alive (s)</label>
                    <input type="number" x-model.number="settings.l2_interval_alive_sec">
                  </div>
                  <div class="field">
                    <label>L2 间隔 · dead (s)</label>
                    <input type="number" x-model.number="settings.l2_interval_dead_sec">
                  </div>
                  <div class="field">
                    <label>全局 L2 并发</label>
                    <input type="number" x-model.number="settings.global_l2_concurrency">
                    <div class="note">应用于后续探活调度</div>
                  </div>
                </div>
                <div class="row" style="margin-top:4px">
                  <div class="note" style="flex:1">周期探活由各 Upstream 的 Active/Lazy 决定；服务总闸见顶部暂停按钮。</div>
                  <label class="check"><input type="checkbox" x-model="settings.piggyback_enabled"> piggyback（真实请求成功抵扣一次 L2）</label>
                  <label class="check"><input type="checkbox" x-model="settings.half_open_enabled"> 半开（给判死的站放行少量真实请求）</label>
                </div>

                <h3 style="font-size:13px;margin:18px 0 8px">健康状态机</h3>
                <div class="row">
                  <div class="field">
                    <label>连续失败几次判 dead</label>
                    <input type="number" x-model.number="settings.fail_threshold">
                  </div>
                  <div class="field">
                    <label>连续成功几次升 alive</label>
                    <input type="number" x-model.number="settings.ok_threshold">
                  </div>
                  <div class="field">
                    <label>429 冷却 (s)</label>
                    <input type="number" x-model.number="settings.cooldown_sec">
                    <div class="note">上游给了 retry-after 时以它为准</div>
                  </div>
                </div>

                <h3 style="font-size:13px;margin:18px 0 8px">请求内重试（§3.5 / §11）</h3>
                <div class="row">
                  <div class="field">
                    <label>最大尝试次数</label>
                    <input type="number" min="1" :max="limits.max_retry_attempts || 5"
                           x-model.number="settings.retry_max_attempts">
                    <div class="note"
                         x-text="`含第一次，填 1 = 不重试。上限 ${limits.max_retry_attempts || 5} —— 这是一次客户端请求最多向上游发几次完整请求，每次都可能真的消耗 token`"></div>
                  </div>
                  <div class="field">
                    <label>重试策略</label>
                    <select x-model="settings.retry_policy">
                      <option value="safe">safe（仅未写入证据）</option>
                      <option value="balanced">balanced（默认）</option>
                      <option value="aggressive">aggressive</option>
                    </select>
                    <div class="note warn" x-show="settings.retry_policy === 'aggressive'">
                      Aggressive 会把提交前首字节等待扩大到 real_first_byte_sec，
                      从而延迟响应头发出，且可能对上游重复执行请求。
                    </div>
                  </div>
                </div>

                <h3 style="font-size:13px;margin:18px 0 8px">请求日志</h3>
                <div class="note" style="margin-bottom:10px">
                  与样本是<b>两份独立的</b>记录，开关也分开：样本存「发出去的是哪些字节」，
                  日志存「这次请求试了几个站、为什么换、最后有没有救回来」。
                  样本关掉时日志照记 —— 那恰恰是最需要日志的场景。
                </div>
                <div class="row" style="margin-bottom:10px">
                  <label class="check">
                    <input type="checkbox" x-model="settings.request_log_enabled"> 记录请求日志
                  </label>
                </div>
                <div class="row">
                  <div class="field">
                    <label>保留条数</label>
                    <input type="number" min="1" x-model.number="settings.request_log_keep_count">
                    <div class="note">按<b>客户端请求</b>计（一组尝试算一条），不是按行。清理时整组一起删</div>
                  </div>
                  <div class="field">
                    <label>保留天数</label>
                    <input type="number" min="1" x-model.number="settings.request_log_keep_days">
                    <div class="note">与条数取先到者</div>
                  </div>
                  <div class="field">
                    <label>队列容量</label>
                    <input type="number" min="1" x-model.number="settings.request_log_queue_size">
                    <div class="note">改这个要重启。队列满时静默丢弃，丢弃数显示在「请求日志」页顶部</div>
                  </div>
                </div>

                <h3 style="font-size:13px;margin:18px 0 8px">样本记录</h3>
                <div class="row" style="margin-bottom:10px">
                  <label class="check"><input type="checkbox" x-model="settings.sample_enabled"> 记录样本</label>
                </div>
                <div class="note" style="margin-bottom:10px">
                  三个体积上限填 <b>0 = 不限</b>（完整留档，当前默认）。完整留档才能拿去逐字节比对，
                  代价是磁盘与内存随上游响应大小增长 —— 吃紧时填回非零即恢复封顶。
                  另有总磁盘配额（默认 5 GiB）与条数/天数一起滚动清理。
                </div>
                <div class="row">
                  <div class="field">
                    <label>body 上限 (B)</label>
                    <input type="number" min="0" x-model.number="settings.sample_max_body_bytes">
                    <div class="note">0 = 完整保留入站/出站请求体。只影响留档的副本，转发的 body 一直是完整的</div>
                  </div>
                  <div class="field">
                    <label>响应头部留存 (B)</label>
                    <input type="number" min="0" x-model.number="settings.sample_resp_head_bytes">
                    <div class="note">与尾部<b>同时</b>为 0 = 完整保留响应</div>
                  </div>
                  <div class="field">
                    <label>响应尾部留存 (B)</label>
                    <input type="number" min="0" x-model.number="settings.sample_resp_tail_bytes">
                  </div>
                  <div class="field">
                    <label>保留条数</label>
                    <input type="number" min="1" x-model.number="settings.sample_keep_count">
                    <div class="note">与天数、磁盘配额取先到者</div>
                  </div>
                  <div class="field">
                    <label>保留天数</label>
                    <input type="number" min="1" x-model.number="settings.sample_keep_days">
