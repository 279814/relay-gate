          <div class="modal wide">
            <h3>Calibration <span class="mono" x-text="f(calibrationDetail,'ID','id')"></span></h3>
            <p x-text="`state=${f(calibrationDetail,'State','state')} route=${f(calibrationDetail,'RouteID','route_id')} endpoint=${f(calibrationDetail,'Endpoint','endpoint')}`"></p>
            <table>
              <thead><tr><th>#</th><th>Execution</th><th>Disposition</th><th>估入 token</th></tr></thead>
              <tbody>
                <template x-for="(cand, idx) in (f(calibrationDetail,'Candidates','candidates') || [])" :key="idx">
                  <tr>
                    <td x-text="idx"></td>
                    <td class="mono" x-text="f(cand,'ExecutionID','execution_id')"></td>
                    <td x-text="f(cand,'Disposition','disposition')"></td>
                    <td class="num" x-text="f(cand,'EstimatedInputTokens','estimated_input_tokens')"></td>
                  </tr>
                </template>
              </tbody>
            </table>
            <footer><button @click="calibrationDetail = null; _unlockModal()">关闭</button></footer>
          </div>
        </div>
      </template>

      <!-- ── 上游表单 ─────────────────────────────────────── -->
      <template x-if="upForm">
        <div class="mask" @click.self="upForm = null">
          <div class="modal">
            <h3 x-text="upForm.id ? '编辑上游' : '新增上游'"></h3>
            <button x-show="upForm.id" @click="refreshConfigForm('upstreams','upForm')">读取最新配置以比较</button>
            <pre class="mono" x-show="upForm._latest" x-text="JSON.stringify(upForm._latest,null,2)">
            </pre>
            <button x-show="upForm._latest" @click="acceptConfigRevision('upForm')">保留当前编辑，使用最新版本重试</button>
            <div class="field">
              <label>名称</label>
              <input x-model="upForm.name" placeholder="例如 站点A">
            </div>
            <div class="field">
              <label>base_url</label>
              <input x-model="upForm.base_url" class="mono" placeholder="https://api.example.com">
              <!-- 带 /v1 是配置时最容易犯的错，症状是 404 且很难看出根因 -->
              <div class="note">
                填写站点基础地址，具体请求路径由 Endpoint 配置决定；非标准路径可逐项填写完整 URL 覆盖。
              </div>
            </div>
            <div class="field">
              <label>api_key</label>
              <input type="password" x-model="upForm.api_key" class="mono"
                     :placeholder="upForm.id && upForm.api_key_is_set ? '留空 = 不修改现有 key' : 'sk-...'">
              <!-- 后端语义：留空表示不改。不说清的话用户会以为留空是清空 -->
              <div class="note" x-show="upForm.id && upForm.api_key_is_set"
                   x-text="`当前：${upForm.api_key_masked}。留空保存则保持不变`"></div>
              <div class="note">加密存储（AES-GCM），界面只回显脱敏值</div>
            </div>
            <p class="note" x-show="upForm.id">在「配方」页逐个编辑 Endpoint URL 与鉴权；探活请求形状通过 Recipe 编辑、测试和发布。</p>
            <div class="field">
              <label>代理地址（可选）</label>
              <input x-model="upForm.proxy_url" class="mono" placeholder="http://127.0.0.1:1080">
            </div>
            <div class="row">
              <div class="field">
                <label>探活模式</label>
                <select x-model="upForm.probe_mode">
                  <option value="active">Active（周期探活）</option>
                  <option value="lazy">Lazy（不周期请求）</option>
                </select>
                <div class="note" x-show="upForm.probe_mode === 'lazy'">
                  Lazy 不会产生任何周期合成请求；点健康页「测试」仍会产生一次真实模型调用。
                </div>
              </div>
              <div class="field">
                <label>Host Override</label>
                <input x-model="upForm.host_override" class="mono" placeholder="可选，覆盖 Host">
              </div>
              <div class="field">
                <label>TLS Server Name</label>
                <input x-model="upForm.tls_server_name" class="mono" placeholder="可选 SNI">
              </div>
            </div>
            <div class="row">
              <label class="check"><input type="checkbox" x-model="upForm.enabled"> 启用</label>
        <template x-if="!upForm.id">
        <section>
          <h4>五类初始端点</h4>
          <p class="dim">留空 URL 使用基础地址加规范路径。逐项确认鉴权；这些配置将与站点一起创建。</p>
          <template x-for="ep in upForm.initial_endpoints" :key="ep.endpoint">
          <fieldset>
            <legend x-text="ep.endpoint">
            </legend>
            <label>完整 URL 覆盖<input x-model="ep.url_override" class="mono" placeholder="留空使用规范路径">
            </label>
            <label>固定 query 模板<input x-model="ep.fixed_query_template" class="mono" placeholder="可选；凭据用占位符">
            </label>
            <label>认证模式<select x-model="ep.auth_profile.mode">
            <option value="header_bearer">Bearer</option>
            <option value="x_api_key">X-Api-Key</option>
            <option value="api_key">Api-Key</option>
            <option value="auto_calibrated">显式校准</option>
            <option value="fixed_query_secret">固定 query 凭据</option>
            <option value="manual_headers">认证头模板</option>
            </select>
            </label>
            <label>凭据来源<input x-model="ep.auth_profile.secret_ref" class="mono">
            </label>
            <label x-show="ep.auth_profile.mode === 'api_key'">认证头名<input x-model="ep.auth_profile.header_name" placeholder="Api-Key">
            </label>
            <label x-show="ep.auth_profile.mode === 'fixed_query_secret'">query 参数名<input x-model="ep.auth_profile.query_name">
            </label>
            <label x-show="ep.auth_profile.mode === 'manual_headers'">认证头模板 JSON 数组<textarea x-model="ep.manual_headers_raw" class="mono" placeholder='[{"name":"Authorization","values":["Bearer {{UPSTREAM_API_KEY}}"]}]'>
            </textarea>
            </label>
          </fieldset>
          </template>
        </section>
        </template>
            </div>
            <footer>
              <button @click="upForm = null">取消</button>
              <button class="primary" @click="saveUp()" :disabled="busy">保存</button>
            </footer>
          </div>
        </div>
      </template>

      <!-- ── 模型表单 ─────────────────────────────────────── -->
      <template x-if="mnForm">
        <div class="mask" @click.self="mnForm = null">
          <div class="modal">
            <h3 x-text="mnForm.id ? '编辑模型' : '新增模型'"></h3>
            <button x-show="mnForm.id" @click="refreshConfigForm('model-names','mnForm')">读取最新配置以比较</button>
            <pre class="mono" x-show="mnForm._latest" x-text="JSON.stringify(mnForm._latest,null,2)">
            </pre>
            <button x-show="mnForm._latest" @click="acceptConfigRevision('mnForm')">保留当前编辑，使用最新版本重试</button>
            <div class="field">
              <label>模型名</label>
              <input x-model="mnForm.name" class="mono" placeholder="claude-opus-4-8">
              <div class="note">客户端请求 body 里的 model 值</div>
            </div>
            <div class="row">
              <div class="field">
                <label>协议</label>
                <select x-model="mnForm.protocol">
                  <option value="anthropic">anthropic（/v1/messages）</option>
                  <option value="openai-chat">openai-chat（/v1/chat/completions）</option>
                  <option value="openai-responses">openai-responses（/v1/responses）</option>
                </select>
              </div>
              <div class="field">
                <label>匹配方式</label>
                <select x-model="mnForm.match_mode">
                  <option value="exact">exact（精确）</option>
                  <option value="prefix">prefix（前缀）</option>
                </select>
              </div>
            </div>
            <div class="row">
              <div class="field">
                <label>探活 prompt</label>
                <input x-model="mnForm.probe_prompt" class="mono" placeholder="1+1=?">
              </div>
              <div class="field">
                <label>探活 max_tokens</label>
                <input type="number" x-model.number="mnForm.probe_max_tokens">
                <div class="note">openai-responses 实测最低 16，给 1 会被部分站拒绝</div>
              </div>
            </div>
            <div class="row">
              <label class="check"><input type="checkbox" x-model="mnForm.enabled"> 启用</label>
              <label class="check"><input type="checkbox" x-model="mnForm.is_fallback"> 作为该协议的兜底</label>
            </div>
            <div class="note">兜底：未匹配任何模型名的请求走它。每种协议至多一个。</div>
            <footer>
              <button @click="mnForm = null">取消</button>
              <button class="primary" @click="saveMn()" :disabled="busy">保存</button>
            </footer>
          </div>
        </div>
      </template>

      <!-- ── 路由表单 ─────────────────────────────────────── -->
      <template x-if="rtForm">
        <div class="mask" @click.self="rtForm = null">
          <div class="modal">
            <h3 x-text="rtForm.id ? '编辑路由' : '新增路由'"></h3>
            <button x-show="rtForm.id" @click="refreshConfigForm('routes','rtForm')">读取最新配置以比较</button>
            <pre class="mono" x-show="rtForm._latest" x-text="JSON.stringify(rtForm._latest,null,2)">
            </pre>
            <button x-show="rtForm._latest" @click="acceptConfigRevision('rtForm')">保留当前编辑，使用最新版本重试</button>
            <div class="row">
              <div class="field">
                <label>模型</label>
                <select x-model.number="rtForm.model_name_id">
                  <template x-for="m in configOptions('model-names',rtForm.model_name_id)" :key="m.id">
                    <option :value="m.id" x-text="m.name"></option>
                  </template>
                </select>
              </div>
              <div class="field">
                <label>上游</label>
                <select x-model.number="rtForm.upstream_id">
                  <template x-for="u in configOptions('upstreams',rtForm.upstream_id)" :key="u.id">
                    <option :value="u.id" x-text="u.name"></option>
                  </template>
                </select>
              </div>
            </div>
            <div class="row">
              <div class="field">
                <label>优先级</label>
                <input type="number" x-model.number="rtForm.priority">
                <div class="note">1 最高。同优先级按权重加权随机</div>
              </div>
              <div class="field">
                <label>权重</label>
                <input type="number" x-model.number="rtForm.weight">
              </div>
              <div class="field">
                <label>并发上限</label>
                <input type="number" x-model.number="rtForm.max_concurrency">
                <div class="note">0 = 不限</div>
              </div>
            </div>
            <div class="field">
              <label>上游模型名（可选）</label>
              <input x-model="rtForm.upstream_model" class="mono" placeholder="留空 = 不映射">
              <!-- 不映射是推荐路径：body 一个字节都不改 -->
              <div class="note">
                留空则 body 一个字节都不改，这是推荐配置。
                只有该站的模型名与上面的逻辑模型名不同时才需要填。
              </div>
            </div>
            <div class="row">
              <label class="check"><input type="checkbox" x-model="rtForm.enabled"> 启用</label>
        <div class="bar">
        <span>模型选项页</span>
              <button :disabled="!configPages['model-names'].history.length" @click="pageConfig('model-names','prev')">上一页</button>
              <button :disabled="!configPages['model-names'].next" @click="pageConfig('model-names','next')">下一页</button>
        <span>上游选项页</span>
              <button :disabled="!configPages.upstreams.history.length" @click="pageConfig('upstreams','prev')">上一页</button>
              <button :disabled="!configPages.upstreams.next" @click="pageConfig('upstreams','next')">下一页</button>
        </div>
            </div>
            <footer>
              <button @click="rtForm = null">取消</button>
              <button class="primary" @click="saveRt()" :disabled="busy">保存</button>
            </footer>
          </div>
        </div>
      </template>

      <!-- Safe Attempt facts are read separately from sensitive sample bytes. -->
      <template x-if="attemptMetadata.open">
        <div class="mask" @click.self="closeAttemptMetadata()">
          <div class="modal wide" x-ref="attemptMetadataDrawer" role="dialog" aria-modal="true" aria-labelledby="attempt-metadata-title">
            <div class="bar">
              <h3 id="attempt-metadata-title" style="margin:0" x-text="attemptMetadata.title"></h3>
              <span class="grow"></span>
              <button type="button" @click="closeAttemptMetadata()">关闭</button>
            </div>
            <p class="mono wrap" x-show="attemptMetadata.reqID" x-text="'ReqID ' + attemptMetadata.reqID"></p>
            <p class="dim">这里只展示当次尝试记录的事实；不读取样本正文，也不使用当前配置补齐历史。</p>
            <p class="dim" x-show="attemptMetadata.note" x-text="attemptMetadata.note"></p>
            <div class="alert err" x-show="attemptMetadata.error" x-text="attemptMetadata.error"></div>
            <p class="dim" x-show="attemptMetadata.loading">读取安全元数据中…</p>
            <div class="bar" x-show="attemptMetadata.attempts.length">
              <label>选择尝试
                <select x-model.number="attemptMetadata.selected" @change="selectMetadataAttempt()">
                  <template x-for="(a, idx) in attemptMetadata.attempts" :key="a.key">
                    <option :value="idx" x-text="a.title"></option>
                  </template>
                </select>
              </label>
              <button type="button" x-show="attemptMetadata.sampleID" @click="openSampleMetadata(attemptMetadata.sampleID)" :disabled="attemptMetadata.loading">刷新元数据</button>
            </div>
            <template x-for="a in attemptMetadata.attempts.slice(attemptMetadata.selected, attemptMetadata.selected + 1)" :key="a.key">
              <div>
                <p class="alert warn" x-show="a.notice" x-text="a.notice"></p>
                <div class="bar" style="margin:12px 0">
                  <span class="tag unknown" x-text="'元数据版本：' + a.version"></span>
                  <span class="dim" x-text="a.executionState"></span>
                  <button type="button" @click="openMetadataExecution()" :disabled="!a.canOpenExecution || attemptMetadata.executionLoading">精确 Execution</button>
                </div>
                <p class="mono wrap" x-show="a.executionID" x-text="'Execution ID ' + a.executionID"></p>
                <dl class="kv">
                  <template x-for="f in a.identity" :key="f.label"><div style="display:contents"><dt x-text="f.label"></dt><dd class="mono wrap" x-text="f.value"></dd></div></template>
                </dl>
                <h3 style="margin-top:18px">阶段与写出</h3>
                <p class="dim" x-text="'已保存响应的含义：' + a.responseView"></p>
                <dl class="kv">
                  <template x-for="f in a.timings" :key="f.label"><div style="display:contents"><dt x-text="f.label"></dt><dd class="mono wrap" x-text="f.value"></dd></div></template>
                </dl>
                <h3 style="margin-top:18px">重试、写入与实际结论</h3>
                <dl class="kv">
                  <template x-for="f in a.decisions" :key="f.label"><div style="display:contents"><dt x-text="f.label"></dt><dd class="wrap" x-text="f.value"></dd></div></template>
                </dl>
                <details class="blk">
                  <summary>发送时的配置与转换版本</summary>
                  <dl class="kv">
                    <template x-for="f in a.revisions" :key="f.label"><div style="display:contents"><dt x-text="f.label"></dt><dd class="mono wrap" x-text="f.value"></dd></div></template>
                  </dl>
                </details>
                <template x-for="d in a.diffs" :key="d.label">
                  <details class="blk">
                    <summary x-text="d.label"></summary>
                    <p class="dim" x-text="d.reason"></p>
                    <dl class="kv">
                      <dt>正文是否变化</dt><dd x-text="d.body"></dd>
                      <dt>头是否变化</dt><dd x-text="d.headers"></dd>
                      <dt>输入正文 SHA-256</dt><dd class="mono wrap" style="overflow-wrap:anywhere" x-text="d.inputHash"></dd>
                      <dt>输出正文 SHA-256</dt><dd class="mono wrap" style="overflow-wrap:anywhere" x-text="d.outputHash"></dd>
                    </dl>
                  </details>
                </template>
              </div>
            </template>
            <footer>
              <button type="button" x-show="attemptMetadata.sampleID" @click="openMetadataSampleBody()">查看样本正文（重新认证）</button>
              <button type="button" @click="closeAttemptMetadata()">关闭</button>
            </footer>
          </div>
        </div>
      </template>

      <!-- ── 样本详情 ─────────────────────────────────────── -->
      <template x-if="sample">
        <div class="mask" @click.self="sample = null">
          <div class="modal wide">
            <h3>
              <span x-text="`样本 #${sample.id}`"></span>
              <span class="tag" :class="outcomeClass(sample.outcome)" x-text="sample.outcome"></span>
            </h3>

            <dl class="kv">
              <dt>入站</dt>
              <dd class="mono" x-text="`${sample.in_method} ${sample.in_path}${sample.in_query ? '?' + sample.in_query : ''}`"></dd>
              <dt>出站</dt>
              <dd class="mono" x-text="sample.out_url"></dd>
              <dt>模型</dt>
              <dd class="mono" x-text="sample.model_in + (sample.model_out !== sample.model_in ? ' → ' + sample.model_out : '（未映射）')"></dd>
              <dt>响应</dt>
              <dd x-text="`HTTP ${sample.resp_status}`"></dd>
              <dt>时间线</dt>
              <dd x-text="timeline(sample)"></dd>
              <dt x-show="sample.error">错误</dt>
              <dd x-show="sample.error" class="err-text" x-text="sample.error"></dd>
            </dl>

            <!-- truncated 是位标记，不显示的话无法判断 256KB 是恰好还是被砍过 -->
            <div class="alert err" x-show="sample.truncated" style="margin-top:12px">
              <span x-text="truncNote(sample.truncated)"></span>
            </div>

            <div class="bar" style="margin-top:14px">
              <button @click="openSampleMetadata(sample.id)">逐次尝试元数据</button>
              <button @click="exportHeaders(sample.id)">生成安全配方草稿</button>
              <span class="dim">仅保留协议形状，正文使用探活占位符</span>
            </div>

            <template x-if="hdrExport">
              <div class="panel">
                <strong>安全配方候选</strong>
                <pre class="body mono" x-text="JSON.stringify(hdrExport.candidate, null, 2)"></pre>
                <!-- skipped 要显式展示：让用户知道鉴权头是刻意排除的 -->
                <p class="dim" x-show="hdrExport.skipped?.length">
                  已排除（<span x-text="hdrExport.skipped.length"></span> 项）：
                  <span class="mono" x-text="hdrExport.skipped.join(', ')"></span>。
                  认证和未知头值均不导入；只有明确批准的协议字段会进入草稿。
                </p>
                <div class="bar" style="margin-top:8px">
                  <button class="primary" @click="applyHeaders()">在配方编辑器中打开</button>
                  <button @click="hdrExport = null">关闭</button>
                </div>
              </div>
            </template>

            <details class="blk">
              <summary>入站 headers</summary>
              <pre class="body mono" x-text="JSON.stringify(sample.in_headers, null, 2)"></pre>
            </details>
            <details class="blk">
              <summary>入站 body</summary>
              <pre class="body mono" x-text="b64(sample.in_body)"></pre>
            </details>
            <details class="blk">
              <summary>出站 headers（实际发给上游的）</summary>
              <pre class="body mono" x-text="JSON.stringify(sample.out_headers, null, 2)"></pre>
            </details>
            <details class="blk">
              <summary>出站 body</summary>
              <pre class="body mono" x-text="b64(sample.out_body)"></pre>
            </details>
            <details class="blk">
              <summary>响应 headers</summary>
              <pre class="body mono" x-text="JSON.stringify(sample.resp_headers, null, 2)"></pre>
            </details>
            <details class="blk" open>
              <summary>已保存的响应 body（视图含义见尝试元数据）</summary>
              <pre class="body mono" x-text="b64(sample.resp_body)"></pre>
            </details>

            <footer>
              <button @click="sample = null; hdrExport = null">关闭</button>
            </footer>
          </div>
        </div>
      </template>
    </div>
  </template>

</div>

<style>[x-cloak] { display: none !important; }</style>
<script src="/admin/app.js"></script>
<script type="module" src="/admin/js/boot.mjs"></script>
<script defer src="/admin/alpine.min.js"></script>
</body>
</html>
