# relay-gate 部署：单容器，HTTP 监听，宿主机端口映射到所有接口。
#
#   docker compose up -d --build
#   # or: ./deploy.sh   /   .\deploy.ps1
#
# 访问 http://<主机IP>:${RELAY_PORT:-18787}/admin/
# 首次启动若未设置三项凭据，进程生成并在容器日志打印一次：
# ADMIN_PASSWORD / RELAY_KEYS / ENCRYPTION_KEY。
#
# 宿主机根目录的 .env（见 .env.example）只用于变量插值；不要提交真实凭据。

services:
  relay-gate:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: relay-gate:${VERSION:-dev}
    container_name: relay-gate
    restart: unless-stopped

    # 发布到宿主机所有接口，便于本机与局域网/公网 IP:port 访问。
    # 容器内进程已监听 0.0.0.0:18787（Dockerfile ENV RELAY_ADDR）。
    ports:
      - "${RELAY_PORT:-18787}:18787"

    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 留空时首次启动自动 bootstrap；操作员在 .env 里设置则环境变量优先。
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      RELAY_KEYS: ${RELAY_KEYS:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

    volumes:
      # 库文件、样本、secrets/（含首次 bootstrap 产物）都在这里。
      - ./data:/app/data

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18787/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

    # main.go 给在途请求留了 30s；略大一点避免 docker stop 走 SIGKILL。
    stop_grace_period: 35s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
